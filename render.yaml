# Render Blueprint for the Spring Boot backend.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill in the three prompted variables.
services:
  - type: web
    name: leetcode-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon JDBC settings, e.g. jdbc:postgresql://<endpoint>.neon.tech/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://leetcode-xxxx.vercel.app (no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Signs login tokens. Render generates a random value once; keep it so logins survive restarts.
      - key: AUTH_SECRET
        generateValue: true
      # Email through Resend: password reset links and the optional daily problem email.
      # Without RESEND_API_KEY the app works and simply sends nothing.
      - key: RESEND_API_KEY
        sync: false
      # e.g. LeetCode Practice <hello@yourdomain.com>; the domain must be verified in Resend.
      - key: MAIL_FROM
        sync: false
      # Your Vercel URL again; used for the links inside emails (no trailing slash).
      - key: FRONTEND_URL
        sync: false
      # Optional: a Judge0 instance. Without it the app runs but Run/Submit report "not configured".
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false
