name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        shell: bash
        run: mvn -B verify 2>&1 | tee /tmp/mvn.log
      - name: Show why the build failed (as readable annotations)
        if: failure()
        shell: bash
        run: |
          # failed tests: first lines of each failing surefire report
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -q -E "<<< (FAILURE|ERROR)" "$f"; then
              msg=$(grep -E -A4 "<<< (FAILURE|ERROR)" "$f" | head -c 1500 | tr '\n' ' ')
              echo "::error title=Test failure in $(basename "$f")::$msg"
            fi
          done
          # compile / context errors
          msg=$(grep -E "\[ERROR\]" /tmp/mvn.log | head -n 12 | head -c 1800 | tr '\n' ' ')
          [ -n "$msg" ] && echo "::error title=Maven errors::$msg"
          exit 0

  problems:
    name: Problems (verify solutions in Python, C++ and Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # python3 and g++ are preinstalled on ubuntu-latest runners.
      - run: node scripts/verify.js

  answers:
    name: Answers (verify against test cases in all languages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: node scripts/verify-answers.js
      - name: solutions.json is up to date
        run: |
          node scripts/build-solutions.js
          git diff --exit-code backend/src/main/resources/seed/solutions.json

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The bundled offline problem data must match the seed file.
      - run: python3 ../scripts/build-snapshot.py
      - run: git diff --exit-code -- public/problems-snapshot.json
      # `next build` also type-checks the project.
      - run: npm run build
