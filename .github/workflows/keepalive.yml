# Render's free web service sleeps after ~15 min idle. Pinging it every 10 minutes keeps it awake
# (free for public repos). The job fails loudly if the API is down, so GitHub emails you.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and execution status
        run: |
          API="https://leetcode-api-i731.onrender.com"
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$API/actuator/health"
          echo
          curl -fsS --max-time 60 "$API/api/execution/status"
          echo
