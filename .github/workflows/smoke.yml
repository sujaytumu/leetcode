# Manual end-to-end check of the live deployment (timing, CORS, execution status, Run, Submit).
name: smoke-test
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test live API
        run: |
          API="https://leetcode-api-i731.onrender.com"
          ORIGINS="https://leetcode-frontend.vercel.app https://leetcode-frontend-sujays-projects-c5bb1f58.vercel.app https://leetcode-frontend-git-main-sujays-projects-c5bb1f58.vercel.app"
          note() { echo "::notice title=$1::$(printf '%s' "$2" | tr '\n' ' ' | head -c 900)"; }
          t() { name="$1"; shift; m=$(curl -sS -o /tmp/out -w "%{http_code} in %{time_total}s" --max-time 180 "$@" 2>&1); note "$name" "$m | $(head -c 500 /tmp/out)"; }
          t "health-1 (cold start shows here)" "$API/actuator/health"
          t "health-2 warm" "$API/actuator/health"
          t "problems" "$API/api/problems?page=0&size=2"
          t "execution-status" "$API/api/execution/status"
          for o in $ORIGINS; do
            r=$(curl -sS -i -X OPTIONS "$API/api/problems/two-sum/run" -H "Origin: $o" \
              -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,x-client-id" | grep -iE "^HTTP|access-control-allow-origin" | tr -d '\r')
            note "cors $o" "$r"
          done
          cat > /tmp/sol.py <<'PY'
          import sys
          lines = sys.stdin.read().splitlines()
          n = int(lines[0]); nums = list(map(int, lines[1].split())); target = int(lines[2])
          seen = {}
          for i, v in enumerate(nums):
              if target - v in seen:
                  print(seen[target - v], i); break
              seen[v] = i
          PY
          python3 - <<'PY' > /tmp/body.json
          import json, textwrap
          code = open('/tmp/sol.py').read()
          print(json.dumps({"language": "python", "code": textwrap.dedent(code)}))
          PY
          t "RUN two-sum python" -X POST "$API/api/problems/two-sum/run" -H "Content-Type: application/json" -H "X-Client-Id: 11111111-1111-1111-1111-111111111111" -d @/tmp/body.json
          t "SUBMIT two-sum python" -X POST "$API/api/problems/two-sum/submit" -H "Content-Type: application/json" -H "X-Client-Id: 11111111-1111-1111-1111-111111111111" -d @/tmp/body.json
