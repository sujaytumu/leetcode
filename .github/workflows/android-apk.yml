name: Android app (APK)

# Builds the LeetCode Android app (a thin shell around the Vercel site) and publishes one stable download link:
# https://github.com/sujaytumu/leetcode/releases/download/android-latest/leetcode.apk
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install and sync Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -l app/build/outputs/apk/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk leetcode.apk
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest leetcode.apk --title "LeetCode Android app" \
            --notes "Open this page on your phone, download leetcode.apk and allow install from your browser when asked." \
            --target "${{ github.sha }}"
