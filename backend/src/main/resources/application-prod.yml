# Production profile, designed for Neon (https://neon.tech) serverless Postgres.
#
#   SPRING_PROFILES_ACTIVE=prod
#   DB_URL=jdbc:postgresql://<endpoint>.neon.tech/<db>?sslmode=require
#   DB_USER=<role>
#   DB_PASSWORD=<password>
#
# Neon gives you a URL like postgresql://user:pass@host/db?sslmode=require. For JDBC, split it into the three
# variables above and prefix the URL with "jdbc:". If you use the pooled (-pooler) host, append
# "&prepareThreshold=0" because PgBouncer in transaction mode does not support server-side prepared statements.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Neon computes auto-suspend when idle, so keep the pool small, let it shrink to zero,
      # and allow time for a cold start on the first connection.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 120000
      max-lifetime: 540000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# The host checks /actuator/health every few seconds. Querying the database there would stop Neon from ever
# suspending (using up its free compute hours), now that the app stays awake.
management:
  health:
    db:
      enabled: false

server:
  forward-headers-strategy: framework
