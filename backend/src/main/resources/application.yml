spring:
  application:
    name: leetcode-backend
  datasource:
    url: jdbc:h2:mem:leetcode;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: true
  rate-limit:
    runs-per-minute: ${RUNS_PER_MINUTE:20}
  judge0:
    # Leave JUDGE0_URL empty to disable code execution (run/submit return 503).
    base-url: ${JUDGE0_URL:}
    auth-token: ${JUDGE0_AUTH_TOKEN:}
    cpu-time-limit-seconds: 2.0
    read-timeout-seconds: 20
