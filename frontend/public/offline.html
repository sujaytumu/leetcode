<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · LeetCode Practice</title>
<style>
  :root { color-scheme: dark light; --bg:#1a1a1a; --panel:#282828; --line:#3e3e3e; --text:#eff1f6; --mute:#9ca0a8; --accent:#ffa116; }
  @media (prefers-color-scheme: light) { :root { --bg:#f0f0f0; --panel:#fff; --line:#e0e0e0; --text:#262626; --mute:#6b6b6b; --accent:#e08a00; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
    font:400 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width:420px; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; text-align:center; }
  h1 { margin:0 0 8px; font-size:20px; font-weight:600; }
  p { margin:0 0 16px; color:var(--mute); }
  button { font:inherit; font-weight:500; padding:9px 18px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#111; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page isn't saved on this device yet. Pages you have already opened, and the problem list, still work without a connection.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
